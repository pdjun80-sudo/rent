<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0C447C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="설비관리">
<meta name="mobile-web-app-capable" content="yes">
<title>설비관리 — 티시테크그룹</title>
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0C447C;--pl:#E6F1FB;--pm:#378ADD;
  --bg:#F4F6F9;--sf:#FFF;--sf2:#F1F4F8;
  --bd:rgba(0,0,0,0.08);--bd2:rgba(0,0,0,0.14);
  --t1:#1A1A2E;--t2:#5A6478;--t3:#9AA3B2;
  --gBg:#EAF3DE;--gTx:#3B6D11;
  --aBg:#FAEEDA;--aTx:#854F0B;
  --rBg:#FAECE7;--rTx:#993C1D;
  --purBg:#F0EAFA;--purTx:#6B21A8;
  --tealBg:#E0F7F4;--tealTx:#0F766E;
  --orBg:#FFF3E0;--orTx:#B45309;
  --rst:8px;--rmd:12px;--rlg:16px;--rxl:20px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--t1)}
body{overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(70px + var(--sb));min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--sf);border-bottom:0.5px solid var(--bd);padding:calc(var(--st)+10px) 14px 10px;position:sticky;top:0;z-index:50}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.logo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.logo-co{color:var(--p)}
.btn-add{background:var(--p);color:#fff;border:none;border-radius:var(--rst);padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit}

/* company pills */
.co-bar{display:flex;gap:5px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none;margin-bottom:8px}
.co-bar::-webkit-scrollbar{display:none}
.co-btn{padding:5px 13px;border-radius:20px;font-size:12px;border:0.5px solid var(--bd2);background:var(--sf2);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.co-btn.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:500}

/* search row (single line) */
.search-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sw{flex:1;position:relative}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.sw input{width:100%;padding:8px 10px 8px 30px;border:0.5px solid var(--bd2);border-radius:var(--rst);background:var(--sf2);font-size:13px;color:var(--t1);font-family:inherit;outline:none}
.sw input:focus{border-color:var(--pm)}

/* kind filter badges — row below search */
.kind-bar{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.kind-bar::-webkit-scrollbar{display:none}
.kb{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;font-size:11px;border:0.5px solid var(--bd2);background:var(--sf2);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.kb.on{font-weight:500}
.kb-all.on{background:var(--p);border-color:var(--p);color:#fff}
.kb-water.on{background:var(--pl);border-color:var(--pm);color:var(--p)}
.kb-ice.on{background:var(--gBg);border-color:#5a9c2a;color:var(--gTx)}
.kb-air.on{background:var(--purBg);border-color:#9b59b6;color:var(--purTx)}
.kb-hot_cold.on{background:var(--tealBg);border-color:#0e9081;color:var(--tealTx)}

/* ── TABS ── */
.tabs{display:flex;padding:8px 14px 0;gap:3px;background:var(--sf);border-bottom:0.5px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:var(--rst) var(--rst) 0 0;font-size:12px;cursor:pointer;border:0.5px solid transparent;color:var(--t2);background:transparent;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.tab.active{background:var(--sf);border-color:var(--bd2);border-bottom-color:var(--sf);color:var(--t1);font-weight:500;position:relative;top:0.5px}

/* sub-filter bar (appears under tabs) */
.sub-bar{display:flex;gap:5px;overflow-x:auto;padding:8px 14px 4px;background:var(--sf);border-bottom:0.5px solid var(--bd);scrollbar-width:none}
.sub-bar::-webkit-scrollbar{display:none}
.sb-btn{padding:4px 12px;border-radius:20px;font-size:11px;border:0.5px solid var(--bd2);background:var(--sf2);color:var(--t2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.sb-btn.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:500}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.stat-card{background:var(--sf2);border-radius:var(--rst);padding:11px 13px}
.stat-label{font-size:11px;color:var(--t2);margin-bottom:3px}
.stat-val{font-size:19px;font-weight:700;color:var(--t1)}
.stat-val span{font-size:11px;font-weight:400;color:var(--t2)}
.stat-sub{font-size:10px;color:var(--t3);margin-top:2px}

/* ── SECTION ── */
.section{padding:0 14px;margin-top:4px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 0 6px}
.sec-title{font-size:13px;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:5px}
.cnt-badge{background:var(--sf2);color:var(--t2);font-size:10px;padding:2px 7px;border-radius:20px;font-weight:400}
.sec-rent{font-size:11px;color:var(--t2)}

/* ── CARD ── */
.mc{background:var(--sf);border:0.5px solid var(--bd);border-radius:var(--rmd);margin-bottom:7px;cursor:pointer;overflow:hidden;transition:transform .1s}
.mc:active{transform:scale(0.985)}
.c-thumb{width:100%;height:95px;object-fit:cover;display:block}
.c-nophoto{width:100%;height:54px;background:var(--sf2);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--t3);font-size:11px;border-bottom:0.5px solid var(--bd)}
.c-body{padding:9px 11px}
.c-top{display:flex;align-items:flex-start;gap:9px}
.c-icon{width:32px;height:32px;border-radius:var(--rst);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.ic-water{background:var(--pl)}.ic-ice{background:var(--gBg)}.ic-air{background:var(--purBg)}.ic-hot_cold{background:var(--tealBg)}
.c-info{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:500;color:var(--t1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-loc{font-size:11px;color:var(--t2);margin-bottom:3px}
.c-tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;border:0.5px solid var(--bd)}
.t-co{background:var(--sf2);color:var(--t2)}
.t-ok{background:var(--gBg);color:var(--gTx);border-color:transparent}
.t-warn{background:var(--aBg);color:var(--aTx);border-color:transparent}
.t-exp{background:var(--rBg);color:var(--rTx);border-color:transparent}
.t-photo{background:var(--pl);color:var(--p);border-color:transparent}
.t-kind{background:var(--sf2);color:var(--t2);border-color:var(--bd2)}
.c-foot{border-top:0.5px solid var(--bd);margin-top:7px;padding-top:6px;display:flex;justify-content:space-between;align-items:center}
.c-meta{font-size:10px;color:var(--t2)}
.c-rent{font-size:12px;font-weight:700;color:var(--t1)}

/* ── OVERLAY / SHEET ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sh{background:var(--sf);border-radius:var(--rxl) var(--rxl) 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:calc(20px + var(--sb))}
.sh-hdl{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:11px auto 4px}
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 15px 12px}
.sh-title{font-size:15px;font-weight:700;color:var(--t1)}
.x-btn{width:30px;height:30px;border:0.5px solid var(--bd2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--t2);font-size:16px}

/* ── FORM ── */
.fb{padding:0 15px}
.fg{margin-bottom:11px}
.fl{font-size:12px;color:var(--t2);margin-bottom:4px;display:block}
.fi,.fs{width:100%;padding:9px 11px;border:0.5px solid var(--bd2);border-radius:var(--rst);background:var(--sf);font-size:13px;color:var(--t1);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.fi:focus,.fs:focus{border-color:var(--pm)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn-sv{width:100%;padding:13px;background:var(--p);color:#fff;border:none;border-radius:var(--rst);font-size:14px;font-weight:700;cursor:pointer;margin-top:5px;font-family:inherit}
.btn-rm{width:100%;padding:10px;background:transparent;color:var(--rTx);border:0.5px solid #F09595;border-radius:var(--rst);font-size:13px;cursor:pointer;margin-top:7px;font-family:inherit}

/* photo */
.pa{display:flex;gap:7px;margin-bottom:7px}
.pab{flex:1;padding:10px 6px;border:0.5px solid var(--bd2);border-radius:var(--rst);background:var(--sf2);cursor:pointer;font-size:12px;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.pab:active{background:#dde8f0}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:2px}
.tw{position:relative;aspect-ratio:1;border-radius:var(--rst);overflow:hidden;border:0.5px solid var(--bd)}
.tw img{width:100%;height:100%;object-fit:cover;display:block}
.td{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(0,0,0,0.55);border:none;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

/* detail */
.dp-lbl{font-size:12px;font-weight:500;color:var(--t1);padding:12px 15px 7px}
.dp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:0 15px 12px}
.dp-item{aspect-ratio:1;border-radius:var(--rst);overflow:hidden;border:0.5px solid var(--bd);cursor:pointer}
.dp-item img{width:100%;height:100%;object-fit:cover;display:block}
.d-sec{border-top:0.5px solid var(--bd)}
.d-row{display:flex;justify-content:space-between;align-items:center;padding:9px 15px;border-bottom:0.5px solid var(--bd)}
.d-row:last-child{border-bottom:none}
.d-key{font-size:12px;color:var(--t2)}
.d-val{font-size:12px;color:var(--t1);text-align:right;max-width:62%}
.d-val.bold{font-weight:700;font-size:13px}
.d-act{padding:12px 15px 0;display:flex;gap:7px}
.d-edit{flex:1;padding:12px;background:var(--p);color:#fff;border:none;border-radius:var(--rst);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.d-del{padding:12px 14px;background:transparent;color:var(--rTx);border:0.5px solid #F09595;border-radius:var(--rst);font-size:13px;cursor:pointer;font-family:inherit}

/* lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:300;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:92%;max-height:86vh;border-radius:var(--rmd);object-fit:contain}
.lb-x{position:absolute;top:calc(var(--st)+12px);right:14px;width:36px;height:36px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* install banner */
.ib{display:none;background:var(--p);color:#fff;padding:10px 14px;align-items:center;gap:8px;font-size:12px}
.ib.show{display:flex}
.ib button{margin-left:auto;background:#fff;color:var(--p);border:none;border-radius:var(--rst);padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.ib .ibx{background:transparent;color:rgba(255,255,255,.7);padding:3px;font-size:15px;margin-left:0}

.empty{padding:40px 14px;text-align:center;color:var(--t3);font-size:13px}
</style>
</head>
<body>
<div class="ib" id="ib">
  <span>📲 홈 화면에 추가하면 앱처럼 사용할 수 있어요</span>
  <button id="ibBtn">설치</button>
  <button class="ibx" onclick="document.getElementById('ib').classList.remove('show')">✕</button>
</div>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo">🏢 <span class="logo-co" id="logoText">티시테크</span> 설비관리</div>
      <button class="btn-add" onclick="openAdd()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>장비 등록
      </button>
    </div>
    <div class="co-bar" id="coBar"></div>
    <!-- 검색 한 줄 -->
    <div class="search-row">
      <div class="sw">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="srch" placeholder="장비명, 모델, 위치, 메모 검색..." oninput="renderAll()">
      </div>
    </div>
    <!-- 장비 종류 뱃지 -->
    <div class="kind-bar" id="kindBar"></div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabsEl">
    <button class="tab active" id="tabList"     onclick="setTab('list')">전체 목록</button>
    <button class="tab"        id="tabLocation" onclick="setTab('location')">위치별</button>
    <button class="tab"        id="tabMfr"      onclick="setTab('mfr')">제조사별</button>
    <button class="tab"        id="tabExpiry"   onclick="setTab('expiry')">계약 현황</button>
  </div>
  <!-- 하위 필터 바 -->
  <div class="sub-bar" id="subBar"></div>

  <div id="mainContent"></div>
</div>

<!-- ADD/EDIT -->
<div class="ov" id="addOv">
  <div class="sh">
    <div class="sh-hdl"></div>
    <div class="sh-hdr"><div class="sh-title" id="addTitle">신규 장비 등록</div><button class="x-btn" onclick="closeAdd()">✕</button></div>
    <div class="fb">
      <input type="hidden" id="eId">
      <div class="fg"><label class="fl">소속 회사</label><select class="fs" id="eCo"></select></div>
      <div class="fg"><label class="fl">장비 종류</label>
        <select class="fs" id="eKind">
          <option value="정수기">💧 정수기</option>
          <option value="제빙기">🧊 제빙기</option>
          <option value="공기청정기">💨 공기청정기</option>
          <option value="냉온수기">🌡 냉온수기</option>
        </select>
      </div>
      <div class="fg"><label class="fl">설치 위치</label><input class="fi" id="eLoc" placeholder="예: 1공장 탕비실"></div>
      <div class="fg"><label class="fl">제품명 / 모델명</label><input class="fi" id="eModel" placeholder="예: WPUC500FRESL"></div>
      <div class="fg"><label class="fl">제조 / 렌탈사</label><input class="fi" id="eComp" placeholder="예: SK매직, 코웨이, 청호나이스"></div>
      <div class="fr">
        <div class="fg"><label class="fl">월 렌탈료 (원)</label><input type="number" class="fi" id="eRental" placeholder="45000"></div>
        <div class="fg"><label class="fl">계약 기간 (개월)</label><input type="number" class="fi" id="eCM" placeholder="60"></div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">설치일자</label><input type="date" class="fi" id="eInst"></div>
        <div class="fg"><label class="fl">계약 만료일</label><input type="date" class="fi" id="eExp"></div>
      </div>
      <div class="fg"><label class="fl">담당자 / 메모</label><input class="fi" id="eMemo" placeholder="메모, 특이사항 등"></div>
      <div class="fg">
        <label class="fl">장비 사진 (최대 5장)</label>
        <div class="pa">
          <button class="pab" onclick="document.getElementById('camI').click()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>카메라 촬영
          </button>
          <button class="pab" onclick="document.getElementById('galI').click()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>갤러리 선택
          </button>
        </div>
        <input type="file" id="camI" accept="image/*" capture="environment" style="display:none" onchange="handlePhotos(event)">
        <input type="file" id="galI" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">
        <div class="pg" id="pg"></div>
      </div>
      <button class="btn-sv" onclick="saveDev()">저장하기</button>
      <button class="btn-rm" id="delBtn" style="display:none" onclick="delDev()">🗑 이 장비 삭제</button>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="ov" id="detOv">
  <div class="sh">
    <div class="sh-hdl"></div>
    <div class="sh-hdr"><div class="sh-title" id="dTitle"></div><button class="x-btn" onclick="closeDet()">✕</button></div>
    <div id="dPA"></div>
    <div class="d-sec" id="dRows"></div>
    <div class="d-act"><button class="d-edit" id="dEditBtn">✏️ 정보 수정</button><button class="d-del" id="dDelBtn">🗑</button></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="closeLb()">
  <button class="lb-x" onclick="closeLb()">✕</button>
  <img id="lbImg" src="" alt="사진">
</div>

<script>
const SK='tsi_v5';
const COS=['티시테크','티시스틸','태창철강'];
const KIND_MAP={정수기:'water',제빙기:'ice',공기청정기:'air',냉온수기:'hot_cold'};
const KIND_ICON={water:'💧',ice:'🧊',air:'💨',hot_cold:'🌡'};
const KIND_LABEL={water:'정수기',ice:'제빙기',air:'공기청정기',hot_cold:'냉온수기'};

/* ── SUB BAR ── */
function getSubItems(){
  const list=filtered_co_kind();
  if(curTab==='list')return [];
  if(curTab==='location'){
    return ['all',...new Set(list.map(d=>d.location))].filter(Boolean);
  }
  if(curTab==='mfr'){
    return ['all',...new Set(list.map(d=>d.company||'미입력'))].sort();
  }
  if(curTab==='expiry'){
    return ['all','expired','soon','ok','none'];
  }

}
const EXPIRY_LABEL={all:'전체',expired:'계약만료',soon:'90일내',ok:'정상',none:'미입력'};
function buildSubBar(){
  const items=getSubItems();
  const bar=document.getElementById('subBar');
  if(!items.length){bar.style.display='none';return;}

  bar.innerHTML=items.map(v=>{
    const label=curTab==='expiry'?(EXPIRY_LABEL[v]||v):v==='all'?'전체':v;
    return `<button class="sb-btn${curSub===v?' on':''}" onclick="setSub('${v}')">${label}</button>`;
  }).join('');
}
function setSub(v){curSub=v;buildSubBar();renderAll();}

/* ── TAB ── */
function setTab(t){
  curTab=t;curSub='all';
  ['list','location','mfr','expiry'].forEach(id=>{
    const el=document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));
    if(el)el.classList.toggle('active',t===id);
  });
  buildSubBar();renderAll();

/* ── FILTER ── */
function filtered_base(){
  const q=(document.getElementById('srch')||{value:''}).value.toLowerCase();
  return devices.filter(d=>{
    const cOk=d.co===curCo;
    const qOk=!q||[d.location,d.model,d.company,d.memo,d.kind].join(' ').toLowerCase().includes(q);
    return cOk&&qOk;
  });
}
function filtered_co_kind(){
  return filtered_base().filter(d=>curKind==='all'||d.type===curKind);
}
function filtered(){
  const base=filtered_co_kind();
  if(curSub==='all')return base;
  if(curTab==='location')return base.filter(d=>d.location===curSub);
  if(curTab==='mfr')return base.filter(d=>(d.company||'미입력')===curSub);
  if(curTab==='expiry'){
    if(curSub==='expired')return base.filter(d=>daysUntil(d.expiry)<0);
    if(curSub==='soon')return base.filter(d=>{const dd=daysUntil(d.expiry);return dd>=0&&dd<=90;});
    if(curSub==='ok')return base.filter(d=>{const dd=daysUntil(d.expiry);return dd>90;});
    if(curSub==='none')return base.filter(d=>!d.expiry);
  }
  return base;
}

  return `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">총 장비</div><div class="stat-val">${list.length}<span> 대</span></div><div class="stat-sub">${byKind||'없음'}</div></div>
    <div class="stat-card"><div class="stat-label">월 렌탈료 합계</div><div class="stat-val" style="font-size:16px">${rent.toLocaleString()}<span> 원</span></div><div class="stat-sub">연 ${(rent*12).toLocaleString()}원</div></div>
  </div>`;
}
function emptyHtml(){return `<div class="empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 8px;opacity:.35"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>장비가 없습니다</div>`;}
function secHtml(title,color,items,extra){
  return `<div class="section"><div class="sec-hdr"><div class="sec-title"${color?` style="color:${color}"`:''}>${title}<span class="cnt-badge">${items.length}</span></div>${extra?`<span class="sec-rent">${extra}</span>`:''}</div>${items.map(cardHtml).join('')}</div>`;
}

/* ── RENDER MODES ── */
function renderList(){
  const list=filtered();if(!list.length)return emptyHtml();
  return `<div class="section" style="margin-top:6px">${list.map(cardHtml).join('')}</div>`;
}
function renderLocation(){
  const list=filtered();if(!list.length)return emptyHtml();
  if(curSub!=='all')return `<div class="section" style="margin-top:6px">${list.map(cardHtml).join('')}</div>`;
  const locs=[...new Set(list.map(d=>d.location))].sort();
  return locs.map(loc=>secHtml('📍 '+loc,null,list.filter(d=>d.location===loc))).join('');
}
function renderMfr(){
  const list=filtered();if(!list.length)return emptyHtml();
  if(curSub!=='all'){
    const rent=list.reduce((a,d)=>a+(d.rental||0),0);
    return `<div class="section" style="margin-top:6px">${list.map(cardHtml).join('')}</div>`;
  }
  const mfrs=[...new Set(list.map(d=>d.company||'미입력'))].sort();
  return mfrs.map(m=>{
    const items=list.filter(d=>(d.company||'미입력')===m);
    const rent=items.reduce((a,d)=>a+(d.rental||0),0);
    return secHtml('🏭 '+m,null,items,rent?`${rent.toLocaleString()}원/월`:'');
  }).join('');
}
function renderExpiry(){
  const list=filtered_co_kind();
  if(curSub!=='all'){
    const sl=filtered();
    return sl.length?`<div class="section" style="margin-top:6px">${sl.map(cardHtml).join('')}</div>`:emptyHtml();
  }
  const exp=list.filter(d=>daysUntil(d.expiry)<0);
  const soon=list.filter(d=>{const dd=daysUntil(d.expiry);return dd>=0&&dd<=90;});
  const ok=list.filter(d=>{const dd=daysUntil(d.expiry);return dd>90;});
  const none=list.filter(d=>!d.expiry);
  let h='';
  if(exp.length)  h+=secHtml('⚠️ 계약 만료','#A32D2D',exp);
  if(soon.length) h+=secHtml('⏰ 90일 이내 만료','#854F0B',soon);
  if(ok.length)   h+=secHtml('✅ 정상 계약 중','#3B6D11',ok);
  if(none.length) h+=secHtml('📋 만료일 미입력',null,none);
  return h||emptyHtml();
}

function renderAll(){
  buildKindBar();
  const list=filtered();
  let c='';
  if(curTab==='list')c=renderList();
  else if(curTab==='location')c=renderLocation();
  else if(curTab==='mfr')c=renderMfr();
  else c=renderExpiry();
  document.getElementById('mainContent').innerHTML=statsHtml(list)+c;
}

/* ── PHOTO ── */
function renderPG(){
  const g=document.getElementById('pg');if(!g)return;
  g.innerHTML=ephotos.map((s,i)=>`<div class="tw"><img src="${s}" loading="lazy"><button class="td" onclick="rmPhoto(${i})">✕</button></div>`).join('');
}
function rmPhoto(i){ephotos.splice(i,1);renderPG();}
function handlePhotos(e){
  const files=Array.from(e.target.files);
  if(ephotos.length+files.length>5){alert('최대 5장까지 등록 가능합니다.');return;}
  let done=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        const m=900;let w=img.width,h=img.height;
        if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m;}else{w=Math.round(w*m/h);h=m;}}
        c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        ephotos.push(c.toDataURL('image/jpeg',0.78));
        if(++done===files.length)renderPG();
      };img.src=ev.target.result;
    };r.readAsDataURL(f);
  });e.target.value='';
}

/* ── ADD/EDIT ── */
function buildCoSel(sel){document.getElementById('eCo').innerHTML=COS.map(c=>`<option value="${c}"${c===sel?' selected':''}>${c}</option>`).join('');}
function openAdd(id){
  const d=id?devices.find(x=>x.id===id):null;
  document.getElementById('addTitle').textContent=d?'장비 정보 수정':'신규 장비 등록';
  document.getElementById('eId').value=id||'';
  buildCoSel(d?d.co:curCo);
  document.getElementById('eKind').value=d?d.kind:'정수기';
  document.getElementById('eLoc').value=d?d.location:'';
  document.getElementById('eModel').value=d?d.model:'';
  document.getElementById('eComp').value=d?d.company:'';
  document.getElementById('eRental').value=d?d.rental:'';
  document.getElementById('eCM').value=d?d.contractMonth:'';
  document.getElementById('eInst').value=d?d.install:'';
  document.getElementById('eExp').value=d?d.expiry:'';
  document.getElementById('eMemo').value=d?d.memo:'';
  ephotos=d&&d.photos?[...d.photos]:[];
  document.getElementById('delBtn').style.display=d?'block':'none';
  renderPG();
  document.getElementById('addOv').classList.add('open');
}
function closeAdd(){document.getElementById('addOv').classList.remove('open');}
function saveDev(){
  const id=document.getElementById('eId').value||uid();
  const kind=document.getElementById('eKind').value;
  const d={id,co:document.getElementById('eCo').value,kind,type:KIND_MAP[kind]||'water',location:document.getElementById('eLoc').value,model:document.getElementById('eModel').value,company:document.getElementById('eComp').value,rental:parseInt(document.getElementById('eRental').value)||0,contractMonth:parseInt(document.getElementById('eCM').value)||0,install:document.getElementById('eInst').value,expiry:document.getElementById('eExp').value,memo:document.getElementById('eMemo').value,photos:[...ephotos]};
  const idx=devices.findIndex(x=>x.id===id);
  if(idx>=0)devices[idx]=d;else devices.push(d);
  save();closeAdd();curSub='all';buildSubBar();renderAll();
}
function delDev(){
  const id=document.getElementById('eId').value;
  if(!id||!confirm('이 장비를 삭제하시겠습니까?'))return;
  devices=devices.filter(x=>x.id!==id);save();closeAdd();buildSubBar();renderAll();
}

/* ── DETAIL ── */
function openDet(id){
  const d=devices.find(x=>x.id===id);if(!d)return;
  const icon=KIND_ICON[d.type]||'📦';
  document.getElementById('dTitle').textContent=icon+' '+(d.model||'(모델 미입력)');
  let pa='';
  if(d.photos&&d.photos.length){
    pa=`<div class="dp-lbl">📷 장비 사진 (${d.photos.length}장)</div><div class="dp-grid">${d.photos.map((s,i)=>`<div class="dp-item" onclick="openLb('${s}')"><img src="${s}" loading="lazy"></div>`).join('')}</div>`;
  }
  document.getElementById('dPA').innerHTML=pa;
  const days=daysUntil(d.expiry);
  const exStr=d.expiry?`${d.expiry}${days!==null?` (${days<0?'만료됨':days<=90?`D-${days}`:'정상'})`:''}`:'-';
  document.getElementById('dRows').innerHTML=`
    <div class="d-row"><span class="d-key">🏢 소속 회사</span><span class="d-val">${d.co||'-'}</span></div>
    <div class="d-row"><span class="d-key">📋 장비 종류</span><span class="d-val">${d.kind||'-'}</span></div>
    <div class="d-row"><span class="d-key">📍 위치</span><span class="d-val">${d.location||'-'}</span></div>
    <div class="d-row"><span class="d-key">🏭 제조/렌탈사</span><span class="d-val">${d.company||'-'}</span></div>
    <div class="d-row"><span class="d-key">💰 월 렌탈료</span><span class="d-val bold">${d.rental?(d.rental.toLocaleString()+'원'):'미정'}</span></div>
    <div class="d-row"><span class="d-key">📅 설치일자</span><span class="d-val">${d.install||'-'}</span></div>
    <div class="d-row"><span class="d-key">🗓 계약기간</span><span class="d-val">${d.contractMonth?d.contractMonth+'개월':'-'}</span></div>
    <div class="d-row"><span class="d-key">⏳ 만료일</span><span class="d-val">${exStr}</span></div>
    <div class="d-row"><span class="d-key">📝 메모</span><span class="d-val">${d.memo||'-'}</span></div>`;
  document.getElementById('dEditBtn').onclick=()=>{closeDet();openAdd(id);};
  document.getElementById('dDelBtn').onclick=()=>{if(confirm('삭제하시겠습니까?')){devices=devices.filter(x=>x.id!==id);save();closeDet();buildSubBar();renderAll();}};
  document.getElementById('detOv').classList.add('open');
}
function closeDet(){document.getElementById('detOv').classList.remove('open');}
function openLb(src){document.getElementById('lbImg').src=src;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}

document.getElementById('addOv').addEventListener('click',e=>{if(e.target===document.getElementById('addOv'))closeAdd();});
document.getElementById('detOv').addEventListener('click',e=>{if(e.target===document.getElementById('detOv'))closeDet();});

/* ── PWA ── */
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('ib').classList.add('show');});
document.getElementById('ibBtn').addEventListener('click',()=>{if(dp){dp.prompt();dp.userChoice.then(()=>{dp=null;document.getElementById('ib').classList.remove('show');});}});
window.addEventListener('appinstalled',()=>document.getElementById('ib').classList.remove('show'));

load();buildCo();buildSubBar();renderAll();
