<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C447C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="설비관리">
<meta name="mobile-web-app-capable" content="yes">
<title>설비관리 — 티시테크그룹</title>
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0C447C;--primary-light:#E6F1FB;--primary-mid:#378ADD;
  --bg:#F4F6F9;--surface:#FFFFFF;--surface2:#F1F4F8;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text1:#1A1A2E;--text2:#5A6478;--text3:#9AA3B2;
  --green-bg:#EAF3DE;--green-text:#3B6D11;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red-bg:#FAECE7;--red-text:#993C1D;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text1)}
body{overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(72px + var(--safe-bottom));min-height:100vh}

.header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:calc(var(--safe-top) + 12px) 16px 12px;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:16px;font-weight:700;color:var(--text1);display:flex;align-items:center;gap:7px}
.logo-co{color:var(--primary)}
.btn-add{background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit}

.co-selector{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:10px}
.co-selector::-webkit-scrollbar{display:none}
.co-btn{padding:6px 14px;border-radius:20px;font-size:12px;border:0.5px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.co-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}

.search-row{display:flex;gap:7px}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-wrap input{width:100%;padding:9px 10px 9px 34px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);font-size:14px;color:var(--text1);font-family:inherit;outline:none}
.filter-btn{padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);cursor:pointer;font-size:12px;color:var(--text2);white-space:nowrap;font-family:inherit;transition:all .15s}
.filter-btn.on{background:var(--primary-light);border-color:var(--primary-mid);color:var(--primary);font-weight:500}

.tabs{display:flex;padding:10px 16px 0;gap:4px;background:var(--surface);border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:13px;cursor:pointer;border:0.5px solid transparent;color:var(--text2);background:transparent;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:all .15s}
.tab.active{background:var(--surface);border-color:var(--border2);border-bottom-color:var(--surface);color:var(--text1);font-weight:500;position:relative;top:0.5px}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.stat-card{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;color:var(--text1)}
.stat-val span{font-size:13px;font-weight:400;color:var(--text2)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

.section{padding:0 16px;margin-top:4px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 7px}
.sec-title{font-size:13px;font-weight:500;color:var(--text1);display:flex;align-items:center;gap:6px}
.cnt-badge{background:var(--surface2);color:var(--text2);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:400}
.sec-rent{font-size:12px;color:var(--text2)}

.machine-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;overflow:hidden;transition:transform .1s}
.machine-card:active{transform:scale(0.985)}
.card-thumb{width:100%;height:110px;object-fit:cover;display:block}
.card-no-photo{width:100%;height:72px;background:var(--surface2);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text3);font-size:13px;border-bottom:0.5px solid var(--border)}
.card-body{padding:11px 13px}
.card-top{display:flex;align-items:flex-start;gap:10px}
.type-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.tw{background:var(--primary-light)}.ti2{background:var(--green-bg)}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:500;color:var(--text1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-loc{font-size:12px;color:var(--text2);margin-bottom:5px}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--border)}
.tco{background:var(--surface2);color:var(--text2)}
.tok{background:var(--green-bg);color:var(--green-text);border-color:transparent}
.twarn{background:var(--amber-bg);color:var(--amber-text);border-color:transparent}
.texp{background:var(--red-bg);color:var(--red-text);border-color:transparent}
.tphoto{background:var(--primary-light);color:var(--primary);border-color:transparent}
.card-footer{border-top:0.5px solid var(--border);margin-top:9px;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.footer-meta{font-size:12px;color:var(--text2)}
.footer-rent{font-size:13px;font-weight:700;color:var(--text1)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:calc(24px + var(--safe-bottom))}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 4px}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px}
.sheet-title{font-size:16px;font-weight:700;color:var(--text1)}
.close-btn{width:32px;height:32px;border:0.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--text2);font-size:18px}

.form-body{padding:0 16px}
.fgrp{margin-bottom:13px}
.flabel{font-size:13px;color:var(--text2);margin-bottom:5px;display:block}
.finput,.fselect{width:100%;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;color:var(--text1);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.finput:focus,.fselect:focus{border-color:var(--primary-mid)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-save{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}
.btn-del{width:100%;padding:12px;background:transparent;color:var(--red-text);border:0.5px solid #F09595;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit}

.photo-actions{display:flex;gap:8px;margin-bottom:8px}
.photo-action-btn{flex:1;padding:11px 8px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;transition:background .15s}
.photo-action-btn:active{background:#dde6f0}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:2px}
.thumb-wrap{position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;border:0.5px solid var(--border)}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,0.55);border:none;border-radius:50%;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

.d-photo-lbl{font-size:13px;font-weight:500;color:var(--text1);padding:14px 16px 8px}
.d-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 16px 14px}
.d-photo-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;border:0.5px solid var(--border);cursor:pointer}
.d-photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.d-section{border-top:0.5px solid var(--border)}
.d-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:0.5px solid var(--border)}
.d-row:last-child{border-bottom:none}
.d-key{font-size:13px;color:var(--text2)}
.d-val{font-size:13px;color:var(--text1);text-align:right;max-width:60%}
.d-val.bold{font-weight:700;font-size:14px}
.d-actions{padding:14px 16px 0;display:flex;gap:8px}
.d-edit{flex:1;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.d-del{padding:13px 16px;background:transparent;color:var(--red-text);border:0.5px solid #F09595;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-family:inherit}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:300;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:92%;max-height:86vh;border-radius:var(--radius-md);object-fit:contain}
.lb-close{position:absolute;top:calc(var(--safe-top) + 14px);right:16px;width:38px;height:38px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.install-banner{display:none;background:var(--primary);color:#fff;padding:11px 16px;align-items:center;gap:10px;font-size:13px}
.install-banner.show{display:flex}
.install-banner button{margin-left:auto;background:#fff;color:var(--primary);border:none;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.install-banner .ib-x{background:transparent;color:rgba(255,255,255,.7);padding:4px;font-size:16px;margin-left:0}

.empty{padding:48px 16px;text-align:center;color:var(--text3);font-size:14px}
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <span>📲 홈 화면에 추가하면 앱처럼 사용할 수 있어요</span>
  <button id="installBtn">설치</button>
  <button class="ib-x" onclick="document.getElementById('installBanner').classList.remove('show')">✕</button>
</div>

<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">🏢 <span class="logo-co" id="logoText">티시테크</span> 설비관리</div>
      <button class="btn-add" onclick="openAdd()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        장비 등록
      </button>
    </div>
    <div class="co-selector" id="coSelector"></div>
    <div class="search-row">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="장비명, 모델, 위치 검색..." oninput="renderAll()">
      </div>
      <button class="filter-btn on" id="fAll" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" id="fWater" onclick="setFilter('water')">정수기</button>
      <button class="filter-btn" id="fIce" onclick="setFilter('ice')">제빙기</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLocation" onclick="setTab('location')">위치별</button>
    <button class="tab" id="tabList" onclick="setTab('list')">전체 목록</button>
    <button class="tab" id="tabExpiry" onclick="setTab('expiry')">계약 현황</button>
    <button class="tab" id="tabMfr" onclick="setTab('mfr')">제조사별</button>
  </div>

  <div id="mainContent"></div>
</div>

<!-- ADD / EDIT -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title" id="addTitle">신규 장비 등록</div>
      <button class="close-btn" onclick="closeAdd()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="eId">
      <div class="fgrp">
        <label class="flabel">소속 회사</label>
        <select class="fselect" id="eCo"></select>
      </div>
      <div class="fgrp">
        <label class="flabel">장비 종류</label>
        <select class="fselect" id="eType">
          <option value="water">💧 정수기</option>
          <option value="ice">🧊 제빙기</option>
        </select>
      </div>
      <div class="fgrp">
        <label class="flabel">설치 위치</label>
        <input class="finput" id="eLoc" placeholder="예: 3층 휴게실, 1층 로비">
      </div>
      <div class="fgrp">
        <label class="flabel">제품명 / 모델명</label>
        <input class="finput" id="eModel" placeholder="예: 코웨이 IoCare CHP-7301N">
      </div>
      <div class="fgrp">
        <label class="flabel">제조 / 렌탈사</label>
        <input class="finput" id="eCompany" placeholder="예: 코웨이, 쿠쿠, SK매직">
      </div>
      <div class="frow">
        <div class="fgrp"><label class="flabel">월 렌탈료 (원)</label><input type="number" class="finput" id="eRental" placeholder="35000"></div>
        <div class="fgrp"><label class="flabel">계약 기간 (개월)</label><input type="number" class="finput" id="eContractM" placeholder="60"></div>
      </div>
      <div class="frow">
        <div class="fgrp"><label class="flabel">설치일자</label><input type="date" class="finput" id="eInstall"></div>
        <div class="fgrp"><label class="flabel">계약 만료일</label><input type="date" class="finput" id="eExpiry"></div>
      </div>
      <div class="fgrp">
        <label class="flabel">담당자 / 메모</label>
        <input class="finput" id="eMemo" placeholder="관리 담당자, 특이사항 등">
      </div>
      <div class="fgrp">
        <label class="flabel">장비 사진 (최대 5장)</label>
        <div class="photo-actions">
          <button class="photo-action-btn" onclick="document.getElementById('camInput').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            카메라 촬영
          </button>
          <button class="photo-action-btn" onclick="document.getElementById('galInput').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            갤러리 선택
          </button>
        </div>
        <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotos(event)">
        <input type="file" id="galInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">
        <div class="photo-grid" id="photoGrid"></div>
      </div>
      <button class="btn-save" onclick="saveDevice()">저장하기</button>
      <button class="btn-del" id="delBtn" style="display:none" onclick="deleteDevice()">🗑 이 장비 삭제</button>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title" id="dTitle"></div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div id="dPhotoArea"></div>
    <div class="d-section" id="dRows"></div>
    <div class="d-actions">
      <button class="d-edit" id="dEditBtn">✏️ 정보 수정</button>
      <button class="d-del" id="dDelBtn">🗑</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img id="lbImg" src="" alt="장비 사진">
</div>

<script>
const SK = 'tsi_equip_v3';
const COMPANIES = ['티시테크','티시스틸','태창철강'];
let devices=[], currentCo='티시테크', currentFilter='all', currentTab='location', editingPhotos=[];

const defaultData=[
  {id:'d1',co:'티시테크',type:'water',location:'1층 로비',model:'코웨이 IoCare CHP-7301N',company:'코웨이',rental:35000,contractMonth:60,install:'2022-03-15',expiry:'2027-03-14',memo:'김총무',photos:[]},
  {id:'d2',co:'티시테크',type:'water',location:'3층 휴게실',model:'쿠쿠 CP-SS501CW',company:'쿠쿠',rental:28000,contractMonth:48,install:'2021-09-01',expiry:'2025-08-31',memo:'이대리',photos:[]},
  {id:'d3',co:'티시테크',type:'ice',location:'3층 휴게실',model:'SK매직 ICE-210M',company:'SK매직',rental:42000,contractMonth:36,install:'2023-06-20',expiry:'2026-06-19',memo:'',photos:[]},
  {id:'d4',co:'티시스틸',type:'water',location:'공장동 휴게실',model:'청호나이스 CHPI-600BD',company:'청호나이스',rental:31000,contractMonth:60,install:'2020-11-10',expiry:'2025-11-09',memo:'박부장',photos:[]},
  {id:'d5',co:'티시스틸',type:'ice',location:'사무동 1층',model:'아이스트로 IM-100',company:'아이스트로',rental:55000,contractMonth:36,install:'2024-01-05',expiry:'2027-01-04',memo:'',photos:[]},
  {id:'d6',co:'태창철강',type:'water',location:'2층 사무실',model:'LG 퓨리케어 WU500AS',company:'LG전자',rental:33000,contractMonth:60,install:'2023-02-28',expiry:'2028-02-27',memo:'최팀장',photos:[]},
  {id:'d7',co:'태창철강',type:'ice',location:'1층 탕비실',model:'코웨이 IcePlus CIM-100B',company:'코웨이',rental:38000,contractMonth:36,install:'2023-08-01',expiry:'2026-07-31',memo:'',photos:[]},
];

function load(){try{const s=localStorage.getItem(SK);devices=s?JSON.parse(s):defaultData;if(!s)save();}catch(e){devices=defaultData;}}
function save(){try{localStorage.setItem(SK,JSON.stringify(devices));}catch(e){alert('저장 공간 부족. 사진 수를 줄여주세요.');}}
function uid(){return 'd'+Date.now()+Math.random().toString(36).slice(2,6);}
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/864e5);}
function expiryTag(e){const d=daysUntil(e);if(d===null)return '';if(d<0)return '<span class="tag texp">계약만료</span>';if(d<=90)return `<span class="tag twarn">D-${d}</span>`;return '<span class="tag tok">정상</span>';}

function buildCoSelector(){
  document.getElementById('coSelector').innerHTML=COMPANIES.map(c=>`<button class="co-btn${c===currentCo?' on':''}" onclick="setCo('${c}')">${c}</button>`).join('');
}
function setCo(co){currentCo=co;document.getElementById('logoText').textContent=co;buildCoSelector();renderAll();}

function filtered(){
  const q=(document.getElementById('searchInput')||{value:''}).value.toLowerCase();
  return devices.filter(d=>{
    return d.co===currentCo&&(currentFilter==='all'||d.type===currentFilter)&&(!q||[d.location,d.model,d.company,d.memo].join(' ').toLowerCase().includes(q));
  });
}
function setFilter(f){
  currentFilter=f;
  ['All','Water','Ice'].forEach(n=>{const el=document.getElementById('f'+n);if(!el)return;el.classList.toggle('on',(f==='all'&&n==='All')||(f==='water'&&n==='Water')||(f==='ice'&&n==='Ice'));});
  renderAll();
}
function setTab(t){
  currentTab=t;
  ['location','list','expiry','mfr'].forEach(id=>{const el=document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));if(el)el.classList.toggle('active',t===id);});
  renderAll();
}

function cardHtml(d){
  const ic=d.type==='water'?'tw':'ti2',em=d.type==='water'?'💧':'🧊';
  const thumb=d.photos&&d.photos.length?`<img class="card-thumb" src="${d.photos[0]}" alt="장비사진" loading="lazy">`:`<div class="card-no-photo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>사진 없음</div>`;
  const ptag=d.photos&&d.photos.length?`<span class="tag tphoto">📷 ${d.photos.length}</span>`:'';
  const mtag=d.memo?`<span class="tag tco">${d.memo}</span>`:'';
  return `<div class="machine-card" onclick="openDetail('${d.id}')">
    ${thumb}
    <div class="card-body">
      <div class="card-top">
        <div class="type-icon ${ic}">${em}</div>
        <div class="card-info">
          <div class="card-name">${d.model||'(모델 미입력)'}</div>
          <div class="card-loc">📍 ${d.location||'-'}</div>
          <div class="card-tags"><span class="tag tco">${d.company||'-'}</span>${expiryTag(d.expiry)}${ptag}${mtag}</div>
        </div>
        <svg style="color:var(--text3);flex-shrink:0;margin-top:4px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="card-footer">
        <span class="footer-meta">설치 ${d.install||'-'} · ${d.contractMonth||'-'}개월</span>
        <span class="footer-rent">${(d.rental||0).toLocaleString()}원/월</span>
      </div>
    </div>
  </div>`;
}

function statsHtml(list){
  const rent=list.reduce((a,d)=>a+(d.rental||0),0),w=list.filter(d=>d.type==='water').length,ic=list.filter(d=>d.type==='ice').length;
  return `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">총 장비</div><div class="stat-val">${list.length}<span> 대</span></div><div class="stat-sub">정수기 ${w} · 제빙기 ${ic}</div></div>
    <div class="stat-card"><div class="stat-label">월 렌탈료 합계</div><div class="stat-val" style="font-size:18px">${rent.toLocaleString()}<span> 원</span></div><div class="stat-sub">연 ${(rent*12).toLocaleString()}원</div></div>
  </div>`;
}
function emptyHtml(){return `<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 10px;opacity:.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>장비가 없습니다</div>`;}
function secHtml(title,color,items,extra){
  return `<div class="section"><div class="sec-hdr"><div class="sec-title"${color?` style="color:${color}"`:''}>${title}<span class="cnt-badge">${items.length}</span></div>${extra?`<span class="sec-rent">${extra}</span>`:''}</div>${items.map(cardHtml).join('')}</div>`;
}

function renderLocation(){const list=filtered();if(!list.length)return emptyHtml();return[...new Set(list.map(d=>d.location))].sort().map(loc=>secHtml('📍 '+loc,null,list.filter(d=>d.location===loc))).join('');}
function renderList(){const list=filtered();if(!list.length)return emptyHtml();return `<div class="section" style="margin-top:8px">${list.map(cardHtml).join('')}</div>`;}
function renderExpiry(){
  const list=filtered();
  const exp=list.filter(d=>daysUntil(d.expiry)<0),soon=list.filter(d=>{const dd=daysUntil(d.expiry);return dd>=0&&dd<=90;}),ok=list.filter(d=>{const dd=daysUntil(d.expiry);return dd>90;});
  let html='';
  if(exp.length) html+=secHtml('⚠️ 계약 만료','#A32D2D',exp);
  if(soon.length)html+=secHtml('⏰ 90일 이내 만료','#854F0B',soon);
  if(ok.length)  html+=secHtml('✅ 정상 계약 중','#3B6D11',ok);
  return html||emptyHtml();
}
function renderMfr(){
  const list=filtered();if(!list.length)return emptyHtml();
  return[...new Set(list.map(d=>d.company||'미입력'))].sort().map(mfr=>{
    const items=list.filter(d=>(d.company||'미입력')===mfr);
    const rent=items.reduce((a,d)=>a+(d.rental||0),0);
    return secHtml('🏭 '+mfr,null,items,`${rent.toLocaleString()}원/월`);
  }).join('');
}

function renderAll(){
  const list=filtered();
  let c='';
  if(currentTab==='location')c=renderLocation();
  else if(currentTab==='list')c=renderList();
  else if(currentTab==='expiry')c=renderExpiry();
  else c=renderMfr();
  document.getElementById('mainContent').innerHTML=statsHtml(list)+c;
}

function renderPhotoGrid(){
  const g=document.getElementById('photoGrid');if(!g)return;
  g.innerHTML=editingPhotos.map((src,i)=>`<div class="thumb-wrap"><img src="${src}" loading="lazy" alt="사진${i+1}"><button class="thumb-del" onclick="removePhoto(${i})">✕</button></div>`).join('');
}
function removePhoto(i){editingPhotos.splice(i,1);renderPhotoGrid();}
function handlePhotos(e){
  const files=Array.from(e.target.files);
  if(editingPhotos.length+files.length>5){alert('사진은 최대 5장까지 등록 가능합니다.');return;}
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=900;let w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        editingPhotos.push(canvas.toDataURL('image/jpeg',0.78));
        if(++done===files.length)renderPhotoGrid();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function buildCoSelect(sel){document.getElementById('eCo').innerHTML=COMPANIES.map(c=>`<option value="${c}"${c===sel?' selected':''}>${c}</option>`).join('');}
function openAdd(id){
  const d=id?devices.find(x=>x.id===id):null;
  document.getElementById('addTitle').textContent=d?'장비 정보 수정':'신규 장비 등록';
  document.getElementById('eId').value=id||'';
  buildCoSelect(d?d.co:currentCo);
  document.getElementById('eType').value=d?d.type:'water';
  document.getElementById('eLoc').value=d?d.location:'';
  document.getElementById('eModel').value=d?d.model:'';
  document.getElementById('eCompany').value=d?d.company:'';
  document.getElementById('eRental').value=d?d.rental:'';
  document.getElementById('eContractM').value=d?d.contractMonth:'';
  document.getElementById('eInstall').value=d?d.install:'';
  document.getElementById('eExpiry').value=d?d.expiry:'';
  document.getElementById('eMemo').value=d?d.memo:'';
  editingPhotos=d&&d.photos?[...d.photos]:[];
  document.getElementById('delBtn').style.display=d?'block':'none';
  renderPhotoGrid();
  document.getElementById('addOverlay').classList.add('open');
}
function closeAdd(){document.getElementById('addOverlay').classList.remove('open');}
function saveDevice(){
  const id=document.getElementById('eId').value||uid();
  const d={id,co:document.getElementById('eCo').value,type:document.getElementById('eType').value,location:document.getElementById('eLoc').value,model:document.getElementById('eModel').value,company:document.getElementById('eCompany').value,rental:parseInt(document.getElementById('eRental').value)||0,contractMonth:parseInt(document.getElementById('eContractM').value)||0,install:document.getElementById('eInstall').value,expiry:document.getElementById('eExpiry').value,memo:document.getElementById('eMemo').value,photos:[...editingPhotos]};
  const idx=devices.findIndex(x=>x.id===id);
  if(idx>=0)devices[idx]=d;else devices.push(d);
  save();closeAdd();renderAll();
}
function deleteDevice(){
  const id=document.getElementById('eId').value;
  if(!id||!confirm('이 장비를 삭제하시겠습니까?'))return;
  devices=devices.filter(x=>x.id!==id);save();closeAdd();renderAll();
}

function openDetail(id){
  const d=devices.find(x=>x.id===id);if(!d)return;
  const em=d.type==='water'?'💧':'🧊';
  document.getElementById('dTitle').textContent=em+' '+(d.model||'(모델 미입력)');
  let pa='';
  if(d.photos&&d.photos.length){
    pa=`<div class="d-photo-lbl">📷 장비 사진 (${d.photos.length}장)</div><div class="d-photo-grid">${d.photos.map((s,i)=>`<div class="d-photo-item" onclick="openLb('${s}')"><img src="${s}" loading="lazy" alt="사진${i+1}"></div>`).join('')}</div>`;
  }
  document.getElementById('dPhotoArea').innerHTML=pa;
  const days=daysUntil(d.expiry);
  const exStr=d.expiry?`${d.expiry}${days!==null?` (${days<0?'만료됨':days<=90?`D-${days}`:'정상'})`:''}`:'-';
  document.getElementById('dRows').innerHTML=`
    <div class="d-row"><span class="d-key">🏢 소속 회사</span><span class="d-val">${d.co||'-'}</span></div>
    <div class="d-row"><span class="d-key">📍 위치</span><span class="d-val">${d.location||'-'}</span></div>
    <div class="d-row"><span class="d-key">🏭 제조/렌탈사</span><span class="d-val">${d.company||'-'}</span></div>
    <div class="d-row"><span class="d-key">💰 월 렌탈료</span><span class="d-val bold">${(d.rental||0).toLocaleString()}원</span></div>
    <div class="d-row"><span class="d-key">📅 설치일자</span><span class="d-val">${d.install||'-'}</span></div>
    <div class="d-row"><span class="d-key">🗓 계약기간</span><span class="d-val">${d.contractMonth||'-'}개월</span></div>
    <div class="d-row"><span class="d-key">⏳ 만료일</span><span class="d-val">${exStr}</span></div>
    <div class="d-row"><span class="d-key">👤 담당자/메모</span><span class="d-val">${d.memo||'-'}</span></div>`;
  document.getElementById('dEditBtn').onclick=()=>{closeDetail();openAdd(id);};
  document.getElementById('dDelBtn').onclick=()=>{if(confirm('삭제하시겠습니까?')){devices=devices.filter(x=>x.id!==id);save();closeDetail();renderAll();}};
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open');}
function openLb(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLb(){document.getElementById('lightbox').classList.remove('open');}

document.getElementById('addOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('addOverlay'))closeAdd();});
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('detailOverlay'))closeDetail();});

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
document.getElementById('installBtn').addEventListener('click',()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').classList.remove('show');});}});
window.addEventListener('appinstalled',()=>document.getElementById('installBanner').classList.remove('show'));

const manifest={name:"설비관리 — 티시테크그룹",short_name:"설비관리",description:"정수기·제빙기 설비 관리 앱",start_url:"./",display:"standalone",background_color:"#F4F6F9",theme_color:"#0C447C",orientation:"portrait",icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%230C447C'/><text y='130' x='96' font-size='110' text-anchor='middle'>🏢</text></svg>",sizes:"192x192",type:"image/svg+xml"},{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%230C447C'/><text y='360' x='256' font-size='300' text-anchor='middle'>🏢</text></svg>",sizes:"512x512",type:"image/svg+xml"}]};
const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
document.getElementById('manifestLink').href=URL.createObjectURL(blob);

load();buildCoSelector();setFilter('all');
</script>
