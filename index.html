<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C447C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="설비관리">
<meta name="mobile-web-app-capable" content="yes">
<title>티시테크 설비관리</title>
<link rel="manifest" id="manifestLink">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0C447C;
    --primary-light: #E6F1FB;
    --primary-mid: #378ADD;
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface2: #F1F4F8;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text1: #1A1A2E;
    --text2: #5A6478;
    --text3: #9AA3B2;
    --green-bg: #EAF3DE; --green-text: #3B6D11;
    --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --red-bg:   #FAECE7; --red-text:   #993C1D;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); font-family: 'Noto Sans KR', sans-serif; color: var(--text1); }
  body { overflow-x: hidden; }

  /* ── APP SHELL ── */
  #app { max-width: 480px; margin: 0 auto; padding-bottom: calc(72px + var(--safe-bottom)); min-height: 100vh; }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
  .logo { font-size: 16px; font-weight: 700; color: var(--text1); display: flex; align-items: center; gap: 7px; }
  .logo-dot { color: var(--primary); }
  .btn-add {
    background: var(--primary); color: #fff; border: none;
    border-radius: var(--radius-sm); padding: 8px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 5px; font-family: inherit;
  }
  .search-row { display: flex; gap: 7px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); }
  .search-wrap input {
    width: 100%; padding: 9px 10px 9px 34px;
    border: 0.5px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface2); font-size: 14px; color: var(--text1); font-family: inherit;
    outline: none;
  }
  .filter-btn {
    padding: 8px 11px; border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm); background: var(--surface2);
    cursor: pointer; font-size: 13px; color: var(--text2); white-space: nowrap; font-family: inherit;
    transition: all .15s;
  }
  .filter-btn.on { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary); font-weight: 500; }

  /* ── TABS ── */
  .tabs {
    display: flex; padding: 10px 16px 0; gap: 4px;
    background: var(--surface); border-bottom: 0.5px solid var(--border);
  }
  .tab {
    padding: 7px 14px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    font-size: 13px; cursor: pointer; border: 0.5px solid transparent;
    color: var(--text2); background: transparent; font-family: inherit;
    transition: all .15s;
  }
  .tab.active {
    background: var(--surface); border-color: var(--border2);
    border-bottom-color: var(--surface);
    color: var(--text1); font-weight: 500; position: relative; top: 0.5px;
  }

  /* ── STATS ── */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
  .stat-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; }
  .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--text1); }
  .stat-val span { font-size: 13px; font-weight: 400; color: var(--text2); }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── SECTION ── */
  .section { padding: 0 16px; margin-top: 4px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 7px; }
  .section-title { font-size: 13px; font-weight: 500; color: var(--text1); display: flex; align-items: center; gap: 6px; }
  .section-title svg { color: var(--primary-mid); }
  .cnt-badge { background: var(--surface2); color: var(--text2); font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 400; }

  /* ── MACHINE CARD ── */
  .machine-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: 8px;
    cursor: pointer; overflow: hidden;
    transition: transform .1s, box-shadow .1s;
    -webkit-user-select: none; user-select: none;
  }
  .machine-card:active { transform: scale(0.985); }
  .card-thumb { width: 100%; height: 110px; object-fit: cover; display: block; }
  .card-no-photo {
    width: 100%; height: 72px; background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    gap: 6px; color: var(--text3); font-size: 13px;
    border-bottom: 0.5px solid var(--border);
  }
  .card-body { padding: 11px 13px; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .type-icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .type-water { background: var(--primary-light); }
  .type-ice   { background: var(--green-bg); }
  .card-info  { flex: 1; min-width: 0; }
  .card-name  { font-size: 14px; font-weight: 500; color: var(--text1); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-loc   { font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .card-tags  { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 0.5px solid var(--border); }
  .tag-co   { background: var(--surface2); color: var(--text2); }
  .tag-ok   { background: var(--green-bg); color: var(--green-text); border-color: transparent; }
  .tag-warn { background: var(--amber-bg); color: var(--amber-text); border-color: transparent; }
  .tag-exp  { background: var(--red-bg); color: var(--red-text); border-color: transparent; }
  .tag-photo { background: var(--primary-light); color: var(--primary); border-color: transparent; }
  .card-arrow { color: var(--text3); flex-shrink: 0; margin-top: 4px; }
  .card-footer {
    border-top: 0.5px solid var(--border); margin-top: 9px;
    padding-top: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .footer-meta { font-size: 12px; color: var(--text2); }
  .footer-rent { font-size: 13px; font-weight: 700; color: var(--text1); }

  /* ── BOTTOM SHEET BASE ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    width: 100%; max-width: 480px;
    max-height: 92vh; overflow-y: auto;
    padding-bottom: calc(24px + var(--safe-bottom));
  }
  .sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 4px; }
  .sheet-hdr { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 14px; }
  .sheet-title { font-size: 16px; font-weight: 700; color: var(--text1); }
  .close-btn {
    width: 32px; height: 32px; border: 0.5px solid var(--border2);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: transparent; color: var(--text2); font-size: 18px;
  }

  /* ── FORM ── */
  .form-body { padding: 0 16px; }
  .form-group { margin-bottom: 13px; }
  .form-label { font-size: 13px; color: var(--text2); margin-bottom: 5px; display: block; }
  .form-input, .form-select {
    width: 100%; padding: 10px 12px;
    border: 0.5px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface); font-size: 14px; color: var(--text1);
    font-family: inherit; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .form-input:focus, .form-select:focus { border-color: var(--primary-mid); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-save {
    width: 100%; padding: 14px; background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 15px;
    font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit;
  }
  .btn-del {
    width: 100%; padding: 12px; background: transparent;
    color: var(--red-text); border: 0.5px solid #F09595;
    border-radius: var(--radius-sm); font-size: 14px;
    cursor: pointer; margin-top: 8px; font-family: inherit;
  }

  /* ── PHOTO UPLOAD ── */
  .photo-drop {
    border: 1.5px dashed var(--border2); border-radius: var(--radius-md);
    padding: 18px; text-align: center; cursor: pointer;
    background: var(--surface2); margin-bottom: 6px;
    transition: background .15s;
  }
  .photo-drop:active { background: #e8eef5; }
  .photo-drop svg { display: block; margin: 0 auto 7px; color: var(--text3); }
  .photo-drop p  { font-size: 13px; color: var(--text2); font-weight: 500; }
  .photo-drop small { font-size: 11px; color: var(--text3); margin-top: 3px; display: block; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-top: 8px; }
  .thumb-wrap {
    position: relative; aspect-ratio: 1;
    border-radius: var(--radius-sm); overflow: hidden;
    border: 0.5px solid var(--border);
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-del {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; background: rgba(0,0,0,0.55);
    border: none; border-radius: 50%; color: #fff;
    font-size: 13px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; padding: 0;
  }

  /* ── DETAIL ── */
  .detail-photos { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; padding: 0 16px 14px; }
  .detail-photo { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; border: 0.5px solid var(--border); cursor: pointer; }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-photo-lbl { font-size: 13px; font-weight: 500; color: var(--text1); padding: 14px 16px 8px; display: flex; align-items: center; gap: 6px; }
  .detail-section { border-top: 0.5px solid var(--border); }
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 0.5px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .d-key { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .d-val { font-size: 13px; color: var(--text1); text-align: right; max-width: 60%; }
  .d-val.bold { font-weight: 700; font-size: 14px; }
  .detail-actions { padding: 14px 16px 0; display: flex; gap: 8px; }
  .d-edit { flex: 1; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .d-del  { padding: 13px 16px; background: transparent; color: var(--red-text); border: 0.5px solid #F09595; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; font-family: inherit; }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88); z-index: 300;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92%; max-height: 86vh; border-radius: var(--radius-md); object-fit: contain; }
  .lb-close {
    position: absolute; top: calc(var(--safe-top) + 14px); right: 16px;
    width: 38px; height: 38px; background: rgba(255,255,255,0.15);
    border: none; border-radius: 50%; color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* ── EMPTY ── */
  .empty { padding: 48px 16px; text-align: center; color: var(--text3); font-size: 14px; }
  .empty svg { display: block; margin: 0 auto 10px; opacity: .5; }

  /* ── INSTALL BANNER ── */
  .install-banner {
    display: none; background: var(--primary); color: #fff;
    padding: 11px 16px; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .install-banner.show { display: flex; }
  .install-banner button {
    margin-left: auto; background: #fff; color: var(--primary);
    border: none; border-radius: var(--radius-sm); padding: 6px 12px;
    font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .install-banner .ib-close { background: transparent; color: rgba(255,255,255,.7); padding: 4px; font-size: 16px; }
</style>
</head>
<body>

<div class="install-banner" id="installBanner">
  <span>📲 홈 화면에 추가하면 앱처럼 사용할 수 있어요</span>
  <button id="installBtn">설치</button>
  <button class="ib-close" onclick="document.getElementById('installBanner').classList.remove('show')">✕</button>
</div>

<div id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">🏢 <span class="logo-dot">티시테크</span> 설비관리</div>
      <button class="btn-add" onclick="openAdd()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        장비 등록
      </button>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="장비명, 모델, 위치 검색..." oninput="renderAll()">
      </div>
      <button class="filter-btn on" id="fAll" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" id="fWater" onclick="setFilter('water')">정수기</button>
      <button class="filter-btn" id="fIce" onclick="setFilter('ice')">제빙기</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tabLocation" onclick="setTab('location')">위치별</button>
    <button class="tab" id="tabList" onclick="setTab('list')">전체 목록</button>
    <button class="tab" id="tabExpiry" onclick="setTab('expiry')">계약 현황</button>
  </div>

  <div id="mainContent"></div>
</div>

<!-- ADD / EDIT SHEET -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title" id="addTitle">신규 장비 등록</div>
      <button class="close-btn" onclick="closeAdd()">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="eId">
      <div class="form-group">
        <label class="form-label">장비 종류</label>
        <select class="form-select" id="eType">
          <option value="water">💧 정수기</option>
          <option value="ice">🧊 제빙기</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">설치 위치</label>
        <input class="form-input" id="eLoc" placeholder="예: 3층 휴게실, 1층 로비">
      </div>
      <div class="form-group">
        <label class="form-label">제품명 / 모델명</label>
        <input class="form-input" id="eModel" placeholder="예: 코웨이 IoCare CHP-7301N">
      </div>
      <div class="form-group">
        <label class="form-label">제조 / 렌탈사</label>
        <input class="form-input" id="eCompany" placeholder="예: 코웨이, 쿠쿠, SK매직">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">월 렌탈료 (원)</label>
          <input type="number" class="form-input" id="eRental" placeholder="35000">
        </div>
        <div class="form-group">
          <label class="form-label">계약 기간 (개월)</label>
          <input type="number" class="form-input" id="eContractM" placeholder="60">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">설치일자</label>
          <input type="date" class="form-input" id="eInstall">
        </div>
        <div class="form-group">
          <label class="form-label">계약 만료일</label>
          <input type="date" class="form-input" id="eExpiry">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">담당자 / 메모</label>
        <input class="form-input" id="eMemo" placeholder="관리 담당자, 특이사항 등">
      </div>
      <div class="form-group">
        <label class="form-label">장비 사진 (최대 5장)</label>
        <div class="photo-drop" onclick="document.getElementById('photoInput').click()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <p>사진 추가</p>
          <small>탭하여 갤러리에서 선택 · 여러 장 가능</small>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">
        <div class="photo-grid" id="photoGrid"></div>
      </div>
      <button class="btn-save" onclick="saveDevice()">저장하기</button>
      <button class="btn-del" id="delBtn" style="display:none" onclick="deleteDevice()">🗑 이 장비 삭제</button>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-title" id="dTitle"></div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div id="dPhotoArea"></div>
    <div class="detail-section" id="dRows"></div>
    <div class="detail-actions">
      <button class="d-edit" id="dEditBtn">✏️ 정보 수정</button>
      <button class="d-del"  id="dDelBtn">🗑</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img id="lbImg" src="" alt="장비 사진">
</div>

<script>
/* ═══════════════════════════════ DATA ═══════════════════════════════ */
const SK = 'tsi_equip_v2';
let devices = [];
let currentFilter = 'all';
let currentTab = 'location';
let editingPhotos = [];

const defaultData = [
  {id:'d1',type:'water',location:'1층 로비',model:'코웨이 IoCare CHP-7301N',company:'코웨이',rental:35000,contractMonth:60,install:'2022-03-15',expiry:'2027-03-14',memo:'김총무',photos:[]},
  {id:'d2',type:'water',location:'3층 휴게실',model:'쿠쿠 CP-SS501CW',company:'쿠쿠',rental:28000,contractMonth:48,install:'2021-09-01',expiry:'2025-08-31',memo:'이대리',photos:[]},
  {id:'d3',type:'ice', location:'3층 휴게실',model:'SK매직 ICE-210M',company:'SK매직',rental:42000,contractMonth:36,install:'2023-06-20',expiry:'2026-06-19',memo:'',photos:[]},
  {id:'d4',type:'water',location:'5층 회의실',model:'청호나이스 CHPI-600BD',company:'청호나이스',rental:31000,contractMonth:60,install:'2020-11-10',expiry:'2025-11-09',memo:'박부장',photos:[]},
  {id:'d5',type:'ice', location:'1층 로비',model:'아이스트로 IM-100',company:'아이스트로',rental:55000,contractMonth:36,install:'2024-01-05',expiry:'2027-01-04',memo:'',photos:[]},
  {id:'d6',type:'water',location:'2층 사무실',model:'LG 퓨리케어 WU500AS',company:'LG전자',rental:33000,contractMonth:60,install:'2023-02-28',expiry:'2028-02-27',memo:'최팀장',photos:[]},
];

function load() {
  try { const s = localStorage.getItem(SK); devices = s ? JSON.parse(s) : defaultData; if (!s) save(); }
  catch(e) { devices = defaultData; }
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(devices)); }
  catch(e) { alert('저장 공간 부족. 사진 수를 줄여주세요.'); }
}
function uid() { return 'd' + Date.now() + Math.random().toString(36).slice(2,6); }
function daysUntil(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 864e5); }

/* ═══════════════════════════════ TAGS ═══════════════════════════════ */
function expiryTag(e) {
  const d = daysUntil(e);
  if (d === null) return '';
  if (d < 0)   return '<span class="tag tag-exp">계약만료</span>';
  if (d <= 90) return `<span class="tag tag-warn">D-${d}</span>`;
  return '<span class="tag tag-ok">정상</span>';
}

/* ═══════════════════════════════ FILTER ══════════════════════════════ */
function filtered() {
  const q = (document.getElementById('searchInput') || {value:''}).value.toLowerCase();
  return devices.filter(d => {
    const t = currentFilter === 'all' || d.type === currentFilter;
    const s = !q || [d.location, d.model, d.company, d.memo].join(' ').toLowerCase().includes(q);
    return t && s;
  });
}

/* ═══════════════════════════════ CARD HTML ══════════════════════════ */
function cardHtml(d) {
  const iconCls = d.type === 'water' ? 'type-water' : 'type-ice';
  const icon    = d.type === 'water' ? '💧' : '🧊';
  const thumbHtml = d.photos && d.photos.length
    ? `<img class="card-thumb" src="${d.photos[0]}" alt="장비 사진" loading="lazy">`
    : `<div class="card-no-photo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>사진 없음</div>`;
  const photoTag = d.photos && d.photos.length
    ? `<span class="tag tag-photo">📷 ${d.photos.length}</span>` : '';
  const memoTag = d.memo ? `<span class="tag tag-co">${d.memo}</span>` : '';
  return `<div class="machine-card" onclick="openDetail('${d.id}')">
    ${thumbHtml}
    <div class="card-body">
      <div class="card-top">
        <div class="type-icon ${iconCls}">${icon}</div>
        <div class="card-info">
          <div class="card-name">${d.model || '(모델 미입력)'}</div>
          <div class="card-loc">📍 ${d.location || '-'}</div>
          <div class="card-tags">
            <span class="tag tag-co">${d.company || '-'}</span>
            ${expiryTag(d.expiry)}
            ${photoTag}${memoTag}
          </div>
        </div>
        <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="card-footer">
        <span class="footer-meta">설치 ${d.install || '-'} · ${d.contractMonth || '-'}개월</span>
        <span class="footer-rent">${(d.rental||0).toLocaleString()}원/월</span>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════ STATS ══════════════════════════════ */
function statsHtml(list) {
  const total = list.length;
  const water = list.filter(d => d.type === 'water').length;
  const ice   = list.filter(d => d.type === 'ice').length;
  const rent  = list.reduce((a, d) => a + (d.rental || 0), 0);
  return `<div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">총 장비</div>
      <div class="stat-val">${total}<span> 대</span></div>
      <div class="stat-sub">정수기 ${water} · 제빙기 ${ice}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">월 렌탈료 합계</div>
      <div class="stat-val" style="font-size:18px">${rent.toLocaleString()}<span> 원</span></div>
      <div class="stat-sub">연 ${(rent * 12).toLocaleString()}원</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════ RENDER ══════════════════════════════ */
function renderLocation() {
  const list = filtered();
  if (!list.length) return emptyHtml();
  const locs = [...new Set(list.map(d => d.location))].sort();
  return locs.map(loc => {
    const items = list.filter(d => d.location === loc);
    return `<div class="section">
      <div class="section-header">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${loc}<span class="cnt-badge">${items.length}</span>
        </div>
      </div>
      ${items.map(cardHtml).join('')}
    </div>`;
  }).join('');
}

function renderList() {
  const list = filtered();
  if (!list.length) return emptyHtml();
  return `<div class="section" style="margin-top:8px">${list.map(cardHtml).join('')}</div>`;
}

function renderExpiry() {
  const list = filtered();
  const expired = list.filter(d => daysUntil(d.expiry) < 0);
  const soon    = list.filter(d => { const dd = daysUntil(d.expiry); return dd >= 0 && dd <= 90; });
  const normal  = list.filter(d => { const dd = daysUntil(d.expiry); return dd > 90; });
  let html = '';
  if (expired.length) html += section('⚠️ 계약 만료', expired, '#993C1D');
  if (soon.length)    html += section('⏰ 90일 이내 만료', soon, '#854F0B');
  if (normal.length)  html += section('✅ 정상 계약 중', normal, '#3B6D11');
  return html || emptyHtml();
}

function section(title, items, color) {
  return `<div class="section">
    <div class="section-header">
      <div class="section-title" style="color:${color}">${title}<span class="cnt-badge">${items.length}</span></div>
    </div>
    ${items.map(cardHtml).join('')}
  </div>`;
}

function emptyHtml() {
  return `<div class="empty">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    검색 결과가 없습니다
  </div>`;
}

function renderAll() {
  const list = filtered();
  let content = '';
  if (currentTab === 'location') content = renderLocation();
  else if (currentTab === 'list') content = renderList();
  else content = renderExpiry();
  document.getElementById('mainContent').innerHTML = statsHtml(list) + content;
}

/* ═══════════════════════════════ FILTER / TAB ═══════════════════════ */
function setFilter(f) {
  currentFilter = f;
  ['All','Water','Ice'].forEach(n => {
    const el = document.getElementById('f' + n);
    if (!el) return;
    const on = (f==='all'&&n==='All')||(f==='water'&&n==='Water')||(f==='ice'&&n==='Ice');
    el.classList.toggle('on', on);
  });
  renderAll();
}

function setTab(t) {
  currentTab = t;
  ['location','list','expiry'].forEach(id => {
    const el = document.getElementById('tab' + id.charAt(0).toUpperCase() + id.slice(1));
    if (el) el.classList.toggle('active', t === id);
  });
  renderAll();
}

/* ═══════════════════════════════ PHOTO ══════════════════════════════ */
function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  if (!grid) return;
  grid.innerHTML = editingPhotos.map((src, i) => `
    <div class="thumb-wrap">
      <img src="${src}" loading="lazy" alt="사진 ${i+1}">
      <button class="thumb-del" onclick="removePhoto(${i})">✕</button>
    </div>`).join('');
}

function removePhoto(i) { editingPhotos.splice(i, 1); renderPhotoGrid(); }

function handlePhotos(e) {
  const files = Array.from(e.target.files);
  if (editingPhotos.length + files.length > 5) { alert('사진은 최대 5장까지 등록 가능합니다.'); return; }
  let done = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 900; let w = img.width, h = img.height;
        if (w > max || h > max) { if (w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        editingPhotos.push(canvas.toDataURL('image/jpeg', 0.78));
        if (++done === files.length) renderPhotoGrid();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

/* ═══════════════════════════════ ADD / EDIT ═════════════════════════ */
function openAdd(id) {
  const d = id ? devices.find(x => x.id === id) : null;
  document.getElementById('addTitle').textContent = d ? '장비 정보 수정' : '신규 장비 등록';
  document.getElementById('eId').value       = id || '';
  document.getElementById('eType').value     = d ? d.type : 'water';
  document.getElementById('eLoc').value      = d ? d.location : '';
  document.getElementById('eModel').value    = d ? d.model : '';
  document.getElementById('eCompany').value  = d ? d.company : '';
  document.getElementById('eRental').value   = d ? d.rental : '';
  document.getElementById('eContractM').value= d ? d.contractMonth : '';
  document.getElementById('eInstall').value  = d ? d.install : '';
  document.getElementById('eExpiry').value   = d ? d.expiry : '';
  document.getElementById('eMemo').value     = d ? d.memo : '';
  editingPhotos = d && d.photos ? [...d.photos] : [];
  document.getElementById('delBtn').style.display = d ? 'block' : 'none';
  renderPhotoGrid();
  document.getElementById('addOverlay').classList.add('open');
}
function closeAdd() { document.getElementById('addOverlay').classList.remove('open'); }

function saveDevice() {
  const id = document.getElementById('eId').value || uid();
  const d = {
    id, type: document.getElementById('eType').value,
    location:      document.getElementById('eLoc').value,
    model:         document.getElementById('eModel').value,
    company:       document.getElementById('eCompany').value,
    rental:        parseInt(document.getElementById('eRental').value) || 0,
    contractMonth: parseInt(document.getElementById('eContractM').value) || 0,
    install:       document.getElementById('eInstall').value,
    expiry:        document.getElementById('eExpiry').value,
    memo:          document.getElementById('eMemo').value,
    photos:        [...editingPhotos],
  };
  const idx = devices.findIndex(x => x.id === id);
  if (idx >= 0) devices[idx] = d; else devices.push(d);
  save(); closeAdd(); renderAll();
}

function deleteDevice() {
  const id = document.getElementById('eId').value;
  if (!id || !confirm('이 장비를 삭제하시겠습니까?')) return;
  devices = devices.filter(x => x.id !== id);
  save(); closeAdd(); renderAll();
}

/* ═══════════════════════════════ DETAIL ════════════════════════════ */
function openDetail(id) {
  const d = devices.find(x => x.id === id);
  if (!d) return;
  const icon = d.type === 'water' ? '💧' : '🧊';
  document.getElementById('dTitle').textContent = icon + ' ' + (d.model || '(모델 미입력)');

  let photoArea = '';
  if (d.photos && d.photos.length) {
    photoArea = `<div class="detail-photo-lbl">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      장비 사진 (${d.photos.length}장)
    </div>
    <div class="detail-photos">${d.photos.map((src,i) => `<div class="detail-photo" onclick="openLb('${src}')"><img src="${src}" loading="lazy" alt="사진 ${i+1}"></div>`).join('')}</div>`;
  }
  document.getElementById('dPhotoArea').innerHTML = photoArea;

  const days = daysUntil(d.expiry);
  const exStr = d.expiry
    ? `${d.expiry}${days !== null ? ` (${days < 0 ? '만료됨' : days <= 90 ? `D-${days}` : '정상'})` : ''}`
    : '-';

  document.getElementById('dRows').innerHTML = `
    <div class="detail-row"><span class="d-key">📍 위치</span><span class="d-val">${d.location || '-'}</span></div>
    <div class="detail-row"><span class="d-key">🏢 제조/렌탈사</span><span class="d-val">${d.company || '-'}</span></div>
    <div class="detail-row"><span class="d-key">💰 월 렌탈료</span><span class="d-val bold">${(d.rental||0).toLocaleString()}원</span></div>
    <div class="detail-row"><span class="d-key">📅 설치일자</span><span class="d-val">${d.install || '-'}</span></div>
    <div class="detail-row"><span class="d-key">🗓 계약기간</span><span class="d-val">${d.contractMonth || '-'}개월</span></div>
    <div class="detail-row"><span class="d-key">⏳ 만료일</span><span class="d-val">${exStr}</span></div>
    <div class="detail-row"><span class="d-key">👤 담당자/메모</span><span class="d-val">${d.memo || '-'}</span></div>`;

  document.getElementById('dEditBtn').onclick = () => { closeDetail(); openAdd(id); };
  document.getElementById('dDelBtn').onclick  = () => {
    if (confirm('삭제하시겠습니까?')) { devices = devices.filter(x => x.id !== id); save(); closeDetail(); renderAll(); }
  };
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }

/* ═══════════════════════════════ LIGHTBOX ══════════════════════════ */
function openLb(src) { document.getElementById('lbImg').src = src; document.getElementById('lightbox').classList.add('open'); }
function closeLb()   { document.getElementById('lightbox').classList.remove('open'); }

/* ═══════════════════════════════ OVERLAY CLOSE ═════════════════════ */
document.getElementById('addOverlay').addEventListener('click',    e => { if (e.target === document.getElementById('addOverlay'))    closeAdd(); });
document.getElementById('detailOverlay').addEventListener('click', e => { if (e.target === document.getElementById('detailOverlay')) closeDetail(); });

/* ═══════════════════════════════ PWA INSTALL ═══════════════════════ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  }
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
});
